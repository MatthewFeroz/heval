name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes unfinished checks on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: cli (22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p packages/cli/tsconfig.json
      - run: bun run cli:test
      - run: bun run cli:pack
      - run: bunx playwright install --with-deps chromium
      - run: bun run cli:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: heval-cli-node-22
          path: .scratch/mattferoz-heval-*.tgz
          include-hidden-files: true
          if-no-files-found: error

  connected_evaluation:
    name: Connected evaluation end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Harbor
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install 'harbor==0.23.0'
      - name: Verify Docker
        run: |
          docker info
          docker compose version
      - name: Run a no-model connected evaluation
        run: bun run test:evaluations:e2e

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Auth boundary contracts
        run: bun run test:auth
      - name: Server regression tests
        run: bun run test:server
      - name: Vendor proxy regression tests
        run: bun run test:proxy
      - name: Project and chart regression tests
        run: bun run test:unit
      - name: Convex backend and domain tests
        run: bun run test:backend
      - name: Hosted export regression tests
        run: bun run test:exports
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Evaluation browser integration
        run: bun run test:evaluations:ui
      - name: First smoke test onboarding
        run: bun scripts/first-smoke-ui-smoke.ts --capture .scratch/onboarding-after
      - name: Capture onboarding before the change
        if: github.event_name == 'pull_request'
        env:
          ONBOARDING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$ONBOARDING_BASE_SHA"
          if git diff --quiet "$ONBOARDING_BASE_SHA" HEAD -- src/onboarding scripts/first-smoke-ui-smoke.ts; then
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/heval-onboarding-before" "$ONBOARDING_BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/heval-onboarding-before/node_modules"
          cd "$RUNNER_TEMP/heval-onboarding-before"
          bun scripts/first-smoke-ui-smoke.ts --capture "$GITHUB_WORKSPACE/.scratch/onboarding-before"
      - name: Upload onboarding review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-before-after
          path: |
            .scratch/onboarding-before
            .scratch/onboarding-after
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Browser behavior
        run: bun run test:e2e
