name: CI

on:
  push:
  pull_request:

jobs:
  hosted_exports:
    name: Hosted export regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # These tests use Vitest module mocks and must not run under bun test.
      - run: bun run test:exports

  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p packages/cli/tsconfig.json
      - run: bun run cli:test
      - run: bun run cli:pack
      - run: bunx playwright install --with-deps chromium
      - run: bun run cli:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: heval-cli-node-${{ matrix.node }}
          path: .scratch/mattferoz-heval-*.tgz
          include-hidden-files: true
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Server regression tests
        run: bun run test:server
      - name: Project and chart regression tests
        run: bun run test:unit
      - name: Report access and storage regression tests
        run: bun run test:reports
      - name: Docker isolation smoke test (no model calls)
        run: bun run test:docker
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test
        run: bun run test:e2e
      - name: Deployment builds and browser smoke tests
        run: bun run test:deployments
