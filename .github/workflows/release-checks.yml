name: Release checks

# Run before releasing the CLI or changing deployment/worker infrastructure.
on:
  workflow_dispatch:

jobs:
  setup:
    name: Installed setup and Linux worker
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run cli:pack
      - run: bunx playwright install --with-deps chromium
      - run: bun run cli:setup:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: setup-browser-evidence-${{ matrix.os }}
          path: .scratch/setup-*.png
          include-hidden-files: true

  compatibility:
    name: Node 24, deployment builds and legacy Docker runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run cli:pack
      - run: bunx playwright install --with-deps chromium
      - run: bun run cli:smoke
      - run: bun run test:docker
      - run: bun run test:deployments
